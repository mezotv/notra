name: Knip

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect remote Turborepo cache
        if: github.event_name == 'push'
        id: turbo-cache
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          if [ -n "$TURBO_TEAM" ] && [ -n "$TURBO_TOKEN" ]; then
            echo "remote=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Turborepo cache
        if: steps.turbo-cache.outputs.remote != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', '**/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock', '**/turbo.json') }}-

      - name: Run affected Knip checks
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: bunx turbo run knip --affected --filter=web --filter=dashboard --filter=api -- --reporter github-actions

      - name: Run all Knip checks
        if: github.event_name == 'push'
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: bunx turbo run knip --filter=web --filter=dashboard --filter=api -- --reporter github-actions
