<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cookie consent</title>
    <style>
      :root {
        --bg: #e6e8f5;
        --brand: #3b4dff;
        --brand-hover: #2f40e6;
        --card: #ffffff;
        --border: #e5e7eb;
        --divider: #ececf1;
        --title: #1a1a1a;
        --body: #5a5a66;
        --button-text: #1a1a1a;
        --shadow:
          0 1.25rem 3rem -1.5rem rgba(40, 44, 90, 0.18), 0 0.5rem 1rem -0.5rem
          rgba(40, 44, 90, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--title);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }

      .stage {
        width: 100%;
        max-width: 46rem;
        position: relative;
      }

      .consent {
        position: relative;
        background: var(--card);
        border-radius: 1rem;
        box-shadow: var(--shadow);
      }

      .consent__body {
        padding: 1.75rem 2rem 1.5rem;
      }

      .consent__title {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.4;
        margin: 0 0 0.625rem;
        color: var(--title);
        letter-spacing: -0.01em;
      }

      .consent__text {
        font-size: 0.9375rem;
        line-height: 1.55;
        margin: 0;
        color: var(--body);
      }

      .consent__footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1rem 2rem 1.25rem;
        border-top: 0.0625rem solid var(--divider);
      }

      .consent__actions {
        display: flex;
        gap: 0.75rem;
      }

      .btn {
        appearance: none;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 500;
        line-height: 1;
        padding: 0.6875rem 1.125rem;
        border-radius: 0.5rem;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease,
          transform 0.05s ease;
      }

      .btn:active {
        transform: translateY(0.0625rem);
      }

      .btn--ghost {
        background: var(--card);
        color: var(--button-text);
        border: 0.0625rem solid var(--border);
      }

      .btn--ghost:hover {
        background: #f7f7fa;
      }

      .btn--primary {
        background: var(--brand);
        color: #ffffff;
        border: 0.0625rem solid var(--brand);
      }

      .btn--primary:hover {
        background: var(--brand-hover);
        border-color: var(--brand-hover);
      }

      .badge {
        position: absolute;
        right: 2rem;
        bottom: 100%;
        transform: translateY(0.5rem);
        background: var(--brand);
        color: #ffffff;
        font-size: 0.8125rem;
        font-weight: 500;
        padding: 0.5rem 0.875rem;
        border-radius: 0.625rem 0.625rem 0 0;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .badge__logo {
        display: inline-grid;
        grid-template-columns: repeat(2, auto);
        grid-template-rows: repeat(2, auto);
        gap: 0.0625rem 0.125rem;
        font-size: 0.5625rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.02em;
      }

      .badge__logo span {
        display: inline-block;
        min-width: 0.625rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <section
        class="consent"
        role="dialog"
        aria-labelledby="consent-title"
        aria-describedby="consent-desc"
      >
        <div class="badge" aria-label="Secured by INTH">
          <span>Secured by</span>
          <span class="badge__logo" aria-hidden="true">
            <span>I</span><span>N</span><span>T</span><span>H</span>
          </span>
        </div>

        <div class="consent__body">
          <h2 id="consent-title" class="consent__title">
            We value your privacy
          </h2>
          <p id="consent-desc" class="consent__text">
            We use cookies to enhance your browsing experience, analyse site
            traffic and serve personalised content.
          </p>
        </div>

        <div class="consent__footer">
          <button type="button" class="btn btn--ghost">Customise</button>
          <div class="consent__actions">
            <button type="button" class="btn btn--ghost">Reject all</button>
            <button type="button" class="btn btn--primary">Accept all</button>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
